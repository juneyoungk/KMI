<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전체 의사 점수 균등화 내시경 배분기 (조건부 대장 투입)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .input-item {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
            color: #34495e;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background-color: #fafafa;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3498db;
            background-color: #fff;
        }
        button {
            grid-column: span 2;
            padding: 14px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1a252f;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #eaeded;
            font-weight: bold;
            color: #2c3e50;
        }
        tr.total-row {
            background-color: #d5dbdb;
            font-weight: bold;
            border-top: 2px solid #2c3e50;
        }
        .info-box {
            background-color: #eaf2f8;
            border-left: 4px solid #2980b9;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
            border-radius: 0 4px 4px 0;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .bg-col { background-color: #e74c3c; }
        .bg-hy { background-color: #f39c12; }
        .bg-gast1 { background-color: #2ecc71; }
        .bg-gast2 { background-color: #3498db; }
    </style>
</head>
<body>

<div class="container">
    <h1>내시경 배분기 </h1>
    <p>수원 KMI, 2026-05-24</p>
    
    <div class="info-box">
        <strong>💡 핵심 변경 : 하이브리드 의사군 추가 및 자동 대장 갯수 배정 </strong><br>
        <strong>💡 하이브리드가 위 업무를 100% 소화하고도 위 수량이 남는 과포화 상태에서만 대장 의사 투입</strong><br>
    </div>

    <div class="input-group">
        <div class="input-item">
            <label for="Gast_count">위내시경 총 갯수 (개)</label>
            <input type="number" id="Gast_count" value="380">
        </div>
        <div class="input-item">
            <label for="Col_count">대장내시경 총 갯수 (개)</label>
            <input type="number" id="Col_count" value="155">
        </div>
        <div class="input-item">
            <label for="Col_dr1">대장내시경 의사 수 (명)</label>
            <input type="number" id="Col_dr1" value="9">
        </div>
        <div class="input-item">
            <label for="Hy_dr">하이브리드 의사 수 (명)</label>
            <input type="number" id="Hy_dr" value="3">
        </div>
        <div class="input-item">
            <label for="Gast_dr1">정상출근 위내시경 의사 수 (명)</label>
            <input type="number" id="Gast_dr1" value="4">
        </div>
        <div class="input-item">
            <label for="Gast_dr2">늦은출근 위내시경 의사 수 (명)</label>
            <input type="number" id="Gast_dr2" value="2">
        </div>
        <button onclick="calculateIndependentAllocation()">계산하기</button>
    </div>

    <h2>배분 결과 (군별 범위 요약)</h2>
    <div id="resultArea">
        <p>조건을 입력하고 버튼을 누르면 결과가 출력됩니다.</p>
    </div>
</div>

<script>
function calculateIndependentAllocation() {
    const COL_TIME = 21;
    const GAST_TIME = 7;
    const COL_POINT = 3;
    const GAST_POINT = 1;

    let totalGast = parseInt(document.getElementById('Gast_count').value) || 0;
    let totalCol = parseInt(document.getElementById('Col_count').value) || 0;
    
    let pureColDrCount = parseInt(document.getElementById('Col_dr1').value) || 0;    
    let actualHyDrCount = parseInt(document.getElementById('Hy_dr').value) || 0;      
    let numGastDr1 = parseInt(document.getElementById('Gast_dr1').value) || 0; 
    let numGastDr2 = parseInt(document.getElementById('Gast_dr2').value) || 0; 

    let bestScoreDiff = Infinity;
    let bestAllocation = null;

    if ((pureColDrCount + actualHyDrCount + numGastDr1 + numGastDr2) === 0) {
        document.getElementById('resultArea').innerHTML = `<p style="color:#e74c3c; font-weight:bold;">⚠️ 의사 인원 수를 1명 이상 입력해주세요.</p>`;
        return;
    }

    // 하이브리드가 담당할 대장내시경의 총 개수 시뮬레이션
    for (let hCol = 0; hCol <= totalCol; hCol++) {
        let cCol = totalCol - hCol; 

        let tempPureCol = [];
        for(let i=0; i<pureColDrCount; i++) tempPureCol.push({ role: 'Col', col: 0, gast: 0, offset: 0 });
        if(pureColDrCount > 0) {
            let rem = cCol; let idx = 0;
            while(rem > 0) { tempPureCol[idx % pureColDrCount].col++; rem--; idx++; }
        }

        let tempHy = [];
        for(let i=0; i<actualHyDrCount; i++) tempHy.push({ role: 'Hybrid', col: 0, gast: 0, offset: 0 });
        if(actualHyDrCount > 0) {
            let rem = hCol; let idx = 0;
            while(rem > 0) { tempHy[idx % actualHyDrCount].col++; rem--; idx++; }
        }

        let tempG1 = []; for(let i=0; i<numGastDr1; i++) tempG1.push({ role: 'Gast1', col: 0, gast: 0, offset: 0 });
        let tempG2 = []; for(let i=0; i<numGastDr2; i++) tempG2.push({ role: 'Gast2', col: 0, gast: 0, offset: -9 });

        let allWorkers = [...tempPureCol, ...tempHy, ...tempG1, ...tempG2];
        
        if(allWorkers.length > 0) {
            let remGast = totalGast;
            while(remGast > 0) {
                // 현재 각 의사의 실질 보정 점수 계산 함수
                const getScore = (w) => (w.col * COL_POINT) + (w.gast * GAST_POINT) - w.offset;

                // 1단계: 대장 의사를 제외한 의사군 중 최저 점수 찾기
                let nonColWorkers = allWorkers.filter(w => w.role !== 'Col');
                let minNonColScore = nonColWorkers.length > 0 ? Math.min(...nonColWorkers.map(getScore)) : Infinity;

                // 2단계: 대장 의사군 중 최저 점수 찾기
                let colWorkers = allWorkers.filter(w => w.role === 'Col');
                let minColScore = colWorkers.length > 0 ? Math.min(...colWorkers.map(getScore)) : -Infinity;

                // [핵심 스마트 로직] 
                // 위/하이브리드 의사의 최저 점수가 대장 의사의 최저 점수보다 높다는 것은, 
                // 하이브리드군이 위내시경을 풀(100%)로 소화해서 이미 대장의사보다 바빠졌다는 뜻입니다.
                // 이 조건이 충족될 때만 대장 의사군(Col)을 배분 대상에 참여시킵니다.
                let targetWorkers = [];
                if (minNonColScore > minColScore && colWorkers.length > 0) {
                    targetWorkers = allWorkers; // 과포화 상태 -> 전체 의사 대상 배분 (대장 투입)
                } else {
                    targetWorkers = nonColWorkers; // 일반 상태 -> 대장 의사 완전 제외 보호
                }

                targetWorkers.sort((a, b) => {
                    let ptA = getScore(a);
                    let ptB = getScore(b);
                    if (ptA === ptB) {
                        return a.gast - b.gast;
                    }
                    return ptA - ptB;
                });
                
                targetWorkers[0].gast++;
                remGast--;
            }
        }

        function getAvgActualPoint(list, roleName) {
            let filtered = list.filter(d => d.role === roleName);
            if(filtered.length === 0) return null;
            let sum = filtered.reduce((acc, d) => acc + (d.col * COL_POINT) + (d.gast * GAST_POINT), 0);
            return sum / filtered.length;
        }

        let avgColPt = getAvgActualPoint(allWorkers, 'Col');
        let avgHyPt = getAvgActualPoint(allWorkers, 'Hybrid');
        let avgG1Pt = getAvgActualPoint(allWorkers, 'Gast1');

        let validPts = [avgColPt, avgHyPt, avgG1Pt].filter(v => v !== null);
        let diff = Math.max(...validPts) - Math.min(...validPts);

        if (diff < bestScoreDiff) {
            bestScoreDiff = diff;
            bestAllocation = JSON.parse(JSON.stringify(allWorkers));
        }
    }

    let finalDoctors = bestAllocation;

    function getGroupStats(roleName) {
        let list = finalDoctors.filter(d => d.role === roleName);
        if (list.length === 0) return { count: 0, colRange: "0", gastRange: "0", pointRange: "0", timeRange: "0", rawGastArr: [0] };

        let cols = list.map(d => d.col);
        let gasts = list.map(d => d.gast);
        let points = list.map(d => (d.col * COL_POINT) + (d.gast * GAST_POINT));
        let times = list.map(d => (d.col * COL_TIME) + (d.gast * GAST_TIME));

        const rangeStr = (arr) => {
            let min = Math.min(...arr);
            let max = Math.max(...arr);
            return min === max ? `${min}` : `${min} ~ ${max}`;
        };

        return {
            count: list.length,
            colRange: rangeStr(cols),
            gastRange: rangeStr(gasts),
            pointRange: rangeStr(points),
            timeRange: rangeStr(times),
            rawGastArr: gasts
        };
    }

    let colStats = getGroupStats('Col');
    let hyStats = getGroupStats('Hybrid');
    let g1Stats = getGroupStats('Gast1');
    let g2Stats = getGroupStats('Gast2');

    let sumCol = 0, sumGast = 0, sumTime = 0, sumPoint = 0;
    let totalDrsCount = finalDoctors.length;
    
    finalDoctors.forEach(d => {
        sumCol += d.col;
        sumGast += d.gast;
        sumTime += (d.col * COL_TIME) + (d.gast * GAST_TIME);
        sumPoint += (d.col * COL_POINT) + (d.gast * GAST_POINT);
    });

    let colGastMax = Math.max(...colStats.rawGastArr);
    let noticeHtml = "";
    if (colGastMax > 0) {
        noticeHtml = `<div style="color:#e74c3c; font-weight:bold; background-color:#fdebd0; padding:12px; border-radius:4px; margin-bottom:15px;">
            ⚠️ [과포화 알림] 위내시경이 하이브리드 한계를 초과하여 대장 의사군에게 최소한의 위내시경 업무 분담(${colStats.gastRange}개)되었습니다.
        </div>`;
    } else {
        noticeHtml = `<div style="color:#2ecc71; font-weight:bold; background-color:#e8f8f5; padding:12px; border-radius:4px; margin-bottom:15px;">
            ✓ [안내] 위내시경 수량이 하이브리드/위 의사 선에서 수행 가능
        </div>`;
    }

    let html = `<table>
        <thead>
            <tr>
                <th>의사 그룹</th>
                <th>인원수</th>
                <th>대장내시경 범위 (개)</th>
                <th>위내시경 범위 (개)</th>
                <th>실제 시행시간 범위 (분)</th>
                <th>최종 시행점수 범위 (점)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><span class="badge bg-col">대장 의사군</span></td>
                <td>${colStats.count}명</td>
                <td><strong>${colStats.colRange} 개</strong></td>
                <td style="color:${colGastMax > 0 ? '#e74c3c' : '#2ecc71'}; font-weight:bold;">${colStats.gastRange} 개</td>
                <td>${colStats.timeRange} 분</td>
                <td><span style="font-weight:bold; color:#e74c3c;">${colStats.pointRange} 점</span></td>
            </tr>
            <tr style="background-color: #fef9e7;">
                <td><span class="badge bg-hy">하이브리드군</span></td>
                <td>${hyStats.count}명</td>
                <td><strong>${hyStats.colRange} 개</strong></td>
                <td><strong>${hyStats.gastRange} 개</strong></td>
                <td>${hyStats.timeRange} 분</td>
                <td><span style="font-weight:bold; color:#d35400;">${hyStats.pointRange} 점</span></td>
            </tr>
            <tr>
                <td><span class="badge bg-gast1">정상 위 의사군</span></td>
                <td>${g1Stats.count}명</td>
                <td><strong>${g1Stats.colRange} 개</strong></td>
                <td><strong>${g1Stats.gastRange} 개</strong></td>
                <td>${g1Stats.timeRange} 분</td>
                <td><span style="font-weight:bold; color:#2ecc71;">${g1Stats.pointRange} 점</span></td>
            </tr>
            <tr>
                <td><span class="badge bg-gast2">늦은 위 의사군</span></td>
                <td>${g2Stats.count}명</td>
                <td><strong>${g2Stats.colRange} 개</strong></td>
                <td><strong>${g2Stats.gastRange} 개</strong></td>
                <td>${g2Stats.timeRange} 분</td>
                <td><span style="font-weight:bold; color:#3498db;">${g2Stats.pointRange} 점 (-9점 보정)</span></td>
            </tr>
            <tr class="total-row">
                <td>Total</td>
                <td>${totalDrsCount}명</td>
                <td>${sumCol} 개</td>
                <td>${sumGast} 개</td>
                <td>${sumTime} 분</td>
                <td>${sumPoint} 점</td>
            </tr>
        </tbody>
    </table>`;

    document.getElementById('resultArea').innerHTML = noticeHtml + html;
}

window.onload = function() {
    calculateIndependentAllocation();
    
    const inputs = document.querySelectorAll('.input-group input');
    inputs.forEach(input => {
        input.addEventListener('input', calculateIndependentAllocation);
    });
};
</script>

</body>
</html>
